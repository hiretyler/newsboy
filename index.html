:root{
  --desk:#cfc8b8;
  --paper:#f4eeda;
  --paper-hi:#faf6e8;
  --ink:#211c12;
  --ink-soft:#57503f;
  --ink-faint:#8b8371;
  --rule:#3a3122;
  --rule-soft:#c4b894;
  --spot-red:#8c2b1e;
  --hilite:#f5df57;
  --kraft:#a97f52;
  --kraft-deep:#8a6540;
  --shadow:rgba(40,30,10,.35);
}
@media (prefers-color-scheme: dark){
  :root{--desk:#1c1913;--shadow:rgba(0,0,0,.6)}
}
:root[data-theme="dark"]{--desk:#1c1913;--shadow:rgba(0,0,0,.6)}
:root[data-theme="light"]{--desk:#cfc8b8;--shadow:rgba(40,30,10,.35)}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--desk);
  font-family:'Old Standard TT',Georgia,'Times New Roman',serif;
  color:var(--ink);
  line-height:1.45;
}
.sheet{
  max-width:1080px;margin:1.2rem auto 3rem;background:var(--paper);
  padding:1.6rem 2.2rem 2.5rem;position:relative;
  box-shadow:0 1px 2px var(--shadow),0 12px 34px var(--shadow);
  background-image:
    radial-gradient(ellipse at 18% 8%, rgba(120,95,45,.05), transparent 55%),
    radial-gradient(ellipse at 85% 92%, rgba(120,95,45,.07), transparent 50%);
}
@media (max-width:720px){.sheet{padding:1rem .9rem 2rem;margin:.4rem auto 2rem}}

/* ---------- masthead ---------- */
.ears{display:flex;justify-content:space-between;font-size:.68rem;letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase;gap:1rem}
.ears .ear{max-width:16rem}
.masthead{text-align:center;margin:.2rem 0 .3rem}
.masthead h1{
  font-family:'UnifrakturMaguntia',serif;font-weight:400;margin:0;
  font-size:clamp(2.4rem,7.5vw,4.6rem);line-height:1.05;letter-spacing:.01em;
  text-wrap:balance;
}
.masthead .motto{font-style:italic;font-size:.8rem;color:var(--ink-soft);margin-top:.1rem}
.dateline-bar{
  display:flex;justify-content:space-between;align-items:baseline;gap:1rem;
  border-top:3px double var(--rule);border-bottom:1px solid var(--rule);
  margin-top:.55rem;padding:.28rem 0;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;
}
.dateline-bar .mid{text-align:center;flex:1;font-weight:700}
@media (max-width:720px){.dateline-bar{flex-wrap:wrap;justify-content:center;text-align:center}.ears{display:none}}

/* ---------- folio / controls ---------- */
.folio{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;align-items:center;border-bottom:3px double var(--rule);padding:.45rem 0;font-size:.75rem;text-transform:uppercase;letter-spacing:.09em}
.folio button,.folio input[type=date]{
  font-family:inherit;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;
  background:transparent;border:1px solid var(--rule);color:var(--ink);
  padding:.28rem .7rem;cursor:pointer;
}
.folio button:hover{background:var(--ink);color:var(--paper)}
.folio button:focus-visible,.art-tools button:focus-visible,a:focus-visible{outline:2px solid var(--spot-red);outline-offset:2px}
.folio .active{background:var(--ink);color:var(--paper)}
.folio input[type=date]{cursor:pointer;background:var(--paper-hi)}
.folio .sep{color:var(--ink-faint)}

/* ---------- notices ---------- */
.notice{border:2px solid var(--rule);margin:1rem auto;max-width:44rem;padding:.9rem 1.2rem;text-align:center}
.notice h3{margin:.1rem 0 .4rem;font-size:1.05rem;letter-spacing:.14em;text-transform:uppercase}
.notice p{margin:.2rem 0;font-size:.9rem}
.notice.halt h3{color:var(--spot-red)}
.press-wait{text-align:center;padding:3rem 0;color:var(--ink-soft);font-style:italic}
.press-wait .gear{display:inline-block;animation:spin 2.4s linear infinite;font-style:normal}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.press-wait .gear{animation:none}.clip{transform:none !important}}

/* ---------- sections ---------- */
.section{margin-top:1.4rem}
.sec-head{
  text-align:center;margin:0 0 .7rem;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:.22rem 0;font-size:.95rem;letter-spacing:.28em;text-transform:uppercase;font-weight:700;
}
.sec-head small{display:block;font-weight:400;font-size:.62rem;letter-spacing:.18em;color:var(--ink-soft)}
.colwrap{columns:3 250px;column-gap:1.8rem;column-rule:1px solid var(--rule-soft)}
.colwrap-2{columns:2 300px;column-gap:2rem;column-rule:1px solid var(--rule-soft)}

/* ---------- articles ---------- */
.art{break-inside:avoid;margin:0 0 1.15rem;position:relative;padding:.15rem .2rem}
.art h4{margin:0 0 .18rem;font-size:1.08rem;line-height:1.18;text-wrap:balance}
.art h4 .headline{cursor:pointer}
.art h4 .headline:hover{text-decoration:underline}
.art .standing{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--spot-red);font-weight:700;margin-bottom:.14rem}
.art .byline{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);margin:.05rem 0 .3rem}
.art .snippet{font-size:.85rem;margin:0;text-align:justify;hyphens:auto}
.art .snippet::first-letter{font-size:1.35em}
.datestamp{color:var(--spot-red);font-weight:700}
.dup-note{font-size:.65rem;color:var(--ink-faint);font-style:italic}

/* lead story */
.lead{border-bottom:1px solid var(--rule-soft);padding-bottom:1rem;margin-bottom:1rem}

.fleuron{text-align:center;color:var(--ink-soft);margin:.6rem 0;font-size:.9rem;letter-spacing:.6em}
</style>

<div id="app"></div>

<script>
(function(){
"use strict";
const DAY=86400000;

/* ---------------- server plumbing ---------------- */
function gs(fn){
  const args=[].slice.call(arguments,1);
  return new Promise((res,rej)=>{
    const runner=google.script.run.withSuccessHandler(res).withFailureHandler(rej);
    runner[fn].apply(runner,args);
  });
}
function errNotice(err){
  return {title:"STOP THE PRESSES",
    body:"The newsroom could not reach Gmail: "+esc((err&&err.message)||String(err))+
    ". If this is the first visit, re-open the web app URL and grant authorization."};
}

/* ---------------- state ---------------- */
const S={
  view:"paper", mode:"latest", archiveDate:null,
  items:[], weekItems:[], removedThisIssue:[],
  rawMain:[], rawWeek:[],
  loading:false, error:null, reader:null,
  boot:null, clips:[],
};
const M={read:{},unreadMark:{},savedOv:{},dim:{},removed:{},blockedSenders:{}};

/* ---------------- helpers ---------------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function cleanText(s){return String(s||"").replace(/[͏​‌‍﻿­]/g,"").replace(/&#39;/g,"'").replace(/&amp;/g,"&").replace(/&quot;/g,'"').replace(/&gt;/g,">").replace(/&lt;/g,"<").trim();}
function hashCode(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return Math.abs(h);}
const MONTHS=["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
const DAYS=["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
function fmtFull(d){return DAYS[d.getDay()]+", "+MONTHS[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear();}
function fmtShort(ts){const d=new Date(ts);return MONTHS[d.getMonth()].slice(0,3)+". "+d.getDate();}
function fmtTime(ts){const d=new Date(ts);let h=d.getHours(),m=String(d.getMinutes()).padStart(2,"0");const ap=h>=12?"P.M.":"A.M.";h=h%12||12;return h+":"+m+" "+ap;}
function dateInputVal(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

/* ---------------- classification ---------------- */
const BULK_LOCAL=/^(no-?reply|noreply|newsletter[s]?|news|alerts?|jobalerts.*|digest|updates?|support|hello|info|email|mail|marketing|notify|notifications?|do-?not-?reply|team|offers?|promo|deals?|store|shop|sales|contact|press|editor|hit-reply|inmail-hit-reply|messaging-digest-noreply|invitations|jobs-noreply|GeminiNotebook-noreply|google-noreply|linkedin)$/i;
const NOTIFY_SENDERS=/docusign\.net|calendar-notification@|apps-scripts-notifications@|login@|@interviews\.modernloop\.io|@hr\.|@myworkday\.com|@ats\.rippling\.com|@talent\.icims\.com|greenhouse\.io$|greenhouse-jobs\.com|dse_na2@/i;
const NOTIFY_SUBJ=/security code|verification code|verify|sign.?in|password|reset|receipt|invoice|order (confirm|#)|your (application|interview)|interview (with|confirmation|reminder)|invitation:|canceled event|notification:|completed:|document to review|terms of service|storage is \d+% full|summary of failures|thank you for (your interest|applying|verifying)|confirmation from|access code|due soon/i;
const JOB_SENDERS=/jobalerts-noreply@linkedin|alerts@jobs\.80000hours|support@builtin\.com|noreply@oracle\.com|@indeed\.com/i;
const JOB_SUBJ=/job (alert|match|update)|new jobs|latest .* jobs|enablement job/i;
const MOTO=/cycle ?news|motoamerica|moto ?gp|worldsbk|superbike|road ?racing|isle of man|supercross(?!.*game)|flat ?track|sur-?ron|talaria|zero motorcycles|e-?moto|revzilla|cycle gear|motorcycle/i;
const AD_SUBJ=/% ?off|sale\b|deal\b|discount|coupon|promo\b|limited.?time|last chance|free (trial|month|shipping)|upgrade|premium|offer|save \$|act now|don'?t miss|book deal/i;
const AD_SENDERS=/linkedin@em\.linkedin\.com|customergrowth\.com|@email\.clearme\.com/i;
const WIRE_SENDERS=/@email\.claude\.com|@google\.com$|GeminiNotebook/i;
const WIRE_SUBJ=/introducing|now (available|part of|includes)|announc|launch|is now|new from|meet the new/i;

const NAME_MAP=[
  [/jobalerts-noreply@linkedin/i,"LinkedIn Job Wire"],
  [/newsletters-noreply@linkedin/i,"LinkedIn Newsletters"],
  [/linkedin@em\.linkedin/i,"LinkedIn"],
  [/alerts@jobs\.80000hours/i,"80,000 Hours Job Board"],
  [/support@builtin/i,"Built In"],
  [/noreply@oracle/i,"Oracle Careers"],
  [/@email\.claude\.com/i,"Anthropic"],
  [/GeminiNotebook|google-noreply/i,"Google"],
  [/@email\.techsmith/i,"TechSmith News"],
  [/customergrowth/i,"Customer Growth"],
  [/clearme/i,"CLEAR"],
  [/@indeed/i,"Indeed"],
  [/cyclenews/i,"Cycle News"],
];
function senderName(addr){
  for(const [re,name] of NAME_MAP){ if(re.test(addr)) return name; }
  const dom=(addr.split("@")[1]||"").replace(/^(email|mail|em|e|news|marketing|hello)\./,"").split(".")[0];
  return dom? dom.charAt(0).toUpperCase()+dom.slice(1) : addr;
}
function isPersonal(addr){
  const local=(addr.split("@")[0]||"");
  if(NOTIFY_SENDERS.test(addr)) return false;
  if(BULK_LOCAL.test(local)) return false;
  if(JOB_SENDERS.test(addr)||AD_SENDERS.test(addr)||WIRE_SENDERS.test(addr)) return false;
  if(/[+]/.test(local)) return false;
  return /^[a-z]+([._-][a-z]+)?[0-9]{0,3}$/i.test(local);
}
function classify(m){
  const from=m.sender.toLowerCase(), subj=cleanText(m.subject||""), snip=cleanText(m.snippet||"");
  if(S.boot&&from===S.boot.email) return null;
  if(M.blockedSenders[from]) return {section:"removed",reason:"sender blocked"};
  if(NOTIFY_SENDERS.test(from)||NOTIFY_SUBJ.test(subj)) return null;
  if((m.to||[]).length>1) return null;
  const looksNewsletter=/newsletter|digest|edition|weekly|bulletin|insights/i.test(subj)||NAME_MAP.some(([re])=>re.test(from));
  if(!looksNewsletter&&isPersonal(from)) return null;
  if(/hit-reply@linkedin|inmail-hit-reply|messaging-digest|invitations@linkedin/.test(from)) return null;
  if(MOTO.test(subj)||MOTO.test(from)) return {section:AD_SUBJ.test(subj)?"ads":"moto",moto:true};
  if(JOB_SENDERS.test(from)||JOB_SUBJ.test(subj)) return {section:"jobs"};
  if(AD_SENDERS.test(from)||AD_SUBJ.test(subj)) return {section:"ads"};
  if(WIRE_SENDERS.test(from)&&WIRE_SUBJ.test(subj)) return {section:"wire"};
  if(WIRE_SUBJ.test(subj)&&snip.length<260) return {section:"wire"};
  return {section:"columns"};
}

/* ---------------- issue assembly ---------------- */
function dedupe(items){
  const map=new Map();
  for(const it of items.slice().sort((a,b)=>a.ts-b.ts)){
    const key=it.sender+"|"+cleanText(it.subject).toLowerCase().replace(/\s+/g," ");
    if(map.has(key)){
      const prev=map.get(key);
      prev.dupCount=(prev.dupCount||1)+1;
      prev.ts=Math.max(prev.ts,it.ts);
      prev.unread=prev.unread&&it.unread;
      prev.saved=prev.saved||it.saved;
    }
    else { it.dupCount=1; map.set(key,it); }
  }
  return [...map.values()].sort((a,b)=>b.ts-a.ts);
}
function prepare(items){
  const out=[],removed=[];
  for(const raw of items){
    const it=Object.assign({},raw);
    it.subject=cleanText(it.subject); it.snippet=cleanText(it.snippet);
    const c=classify(it);
    if(!c) continue;
    it.section=c.section;
    it.paperName=senderName(it.sender);
    if(M.removed[it.id]||c.section==="removed"){ removed.push(it); continue; }
    out.push(it);
  }
  return {out,removed};
}
function derive(){
  const a=prepare(S.rawMain||[]); const b=prepare(S.rawWeek||[]);
  S.items=a.out; S.weekItems=b.out; S.removedThisIssue=a.removed.concat(b.removed);
}
async function loadIssue(fresh){
  S.loading=true; S.error=null; render();
  try{
    if(!S.boot){ S.boot=await gs("boot"); Object.assign(M.dim,S.boot.dim); Object.assign(M.removed,S.boot.removed); Object.assign(M.blockedSenders,S.boot.blockedSenders); S.clips=await gs("getClips"); }
    let start,end;
    if(S.mode==="latest"){ end=Date.now(); start=end-DAY; }
    else { const [y,mo,d]=S.archiveDate.split("-").map(Number); start=new Date(y,mo-1,d).getTime(); end=start+DAY; }
    const fetchStart=(S.mode==="latest")? end-7*DAY : start;
    const flat=await gs("getIssue",fetchStart,end,!!fresh);
    const all=dedupe(flat);
    S.rawMain=all.filter(i=>i.ts>=start);
    S.rawWeek=(S.mode==="latest")? all.filter(i=>i.ts<start) : [];
    derive();
  }catch(err){ S.error=errNotice(err); S.rawMain=[];S.rawWeek=[];S.items=[];S.weekItems=[];S.removedThisIssue=[]; }
  S.loading=false; render();
}

/* ---------------- marks ---------------- */
function marksOf(it){
  const read=M.unreadMark[it.id]?false:(!!M.read[it.id]||it.unread===false);
  const saved=(it.id in M.savedOv)?!!M.savedOv[it.id]:!!it.saved;
  return {read,saved,dim:!!M.dim[it.id]};
}
function isRead(it){ return marksOf(it).read; }
function snapshot(it){ return {id:it.id,threadId:it.threadId,ts:it.ts,sender:it.sender,subject:it.subject,snippet:it.snippet,paperName:it.paperName,clippedFrom:fmtFull(new Date(it.ts))}; }
function findItem(id){ return S.items.concat(S.weekItems).find(x=>x.id===id)||S.clips.find(c=>c.id===id); }
function quietly(p){ p.catch(function(e){ console.warn("mark not persisted:",e&&e.message); }); }

window.nb={
  toggleRead(id){
    const it=findItem(id);
    const cur=it?marksOf(it).read:!!M.read[id];
    if(cur){ delete M.read[id]; M.unreadMark[id]=1; quietly(gs("setRead",id,false)); }
    else { delete M.unreadMark[id]; M.read[id]=1; quietly(gs("setRead",id,true)); }
    render();
  },
  toggleSave(id){
    const it=findItem(id);
    const cur=it?marksOf(it).saved:false;
    const next=!cur;
    M.savedOv[id]=next;
    if(next){ delete M.dim[id]; quietly(gs("setMark","dim",id,false));
      const snap=it?snapshot(it):null;
      if(snap&&!S.clips.some(c=>c.id===id)) S.clips.unshift(snap);
      quietly(gs("setSaved",id,true,snap));
    } else {
      S.clips=S.clips.filter(c=>c.id!==id);
      quietly(gs("setSaved",id,false,null));
    }
    render();
  },
  toggleDim(id){
    const on=!M.dim[id];
    if(on){ M.dim[id]=1; M.savedOv[id]=false; S.clips=S.clips.filter(c=>c.id!==id); quietly(gs("setSaved",id,false,null)); }
    else delete M.dim[id];
    quietly(gs("setMark","dim",id,on));
    render();
  },
  remove(id){ M.removed[id]=1; quietly(gs("setMark","removed",id,true)); derive(); render(); },
  restore(id){ delete M.removed[id]; quietly(gs("setMark","removed",id,false)); derive(); render(); },
  blockSender(addr){ M.blockedSenders[addr]=1; quietly(gs("blockSender",addr,true)); derive(); render(); },
  unblockSender(addr){ delete M.blockedSenders[addr]; quietly(gs("blockSender",addr,false)); derive(); render(); },
  open(id){ openReader(id); },
  closeReader(){ S.reader=null; render(); },
  setView(v){ S.view=v; render(); },
  latest(){ S.mode="latest"; S.archiveDate=null; loadIssue(false); },
  refresh(){ loadIssue(true); },
  pickDate(v){ if(!v) return; S.mode="archive"; S.archiveDate=v; loadIssue(false); },
  stepDay(delta){
    let base; if(S.mode==="latest") base=new Date(); else { const [y,m,d]=S.archiveDate.split("-").map(Number); base=new Date(y,m-1,d); }
    base.setDate(base.getDate()+delta);
    const today=dateInputVal(new Date());
    const v=dateInputVal(base);
    if(v>=today){ window.nb.latest(); return; }
    S.mode="archive"; S.archiveDate=v; loadIssue(false);
  },
};

/* ---------------- reader ---------------- */
async function openReader(id){
  const it=findItem(id);
  if(!it) return;
  S.reader={item:it,body:null,err:null};
  delete M.unreadMark[id]; M.read[id]=1; // server marks read inside getBody
  render();
  try{
    const r=await gs("getBody",id);
    S.reader.body=formatBody(r&&r.body);
  }catch(err){ S.reader.err=errNotice(err); }
  render();
}
function formatBody(text){
  let t=cleanText(text).replace(/<(https?:[^>]+)>/g,"").replace(/\r/g,"");
  t=t.replace(/\n{3,}/g,"\n\n");
  const paras=t.split(/\n\n+/).map(p=>p.trim()).filter(p=>p&&!/^https?:\/\/\S+$/.test(p)).slice(0,120);
  return paras.map(p=>{
    let safe=esc(p.replace(/\n/g," "));
    safe=safe.replace(/https?:\/\/[^\s<]+/g,(u)=>{
      const href=u.replace(/[.,;:)\]]+$|(&#39;)+$/g,"");
      return '<a href="'+href+'" target="_blank" rel="noopener">[link]</a>';
    });
    return "<p>"+safe+"</p>";
  }).join("");
}

/* ---------------- rendering ---------------- */
const CHECK='<svg class="checkmark" viewBox="0 0 24 24" aria-label="read"><path d="M3.5 13.2 C6 15.5, 8.2 18.6, 9.4 20.3 C12 14.5, 16.8 7.4, 21.5 3.4 C16.2 6.8, 11.4 12.6, 9.2 16.5 C7.6 14.6, 5.4 13.4, 3.5 13.2 Z" fill="#8c2b1e" opacity="0.85" transform="rotate(-4 12 12)"/></svg>';
function stateCls(it){const m=marksOf(it);return (m.read?" read":"")+(m.saved?" saved":"")+(m.dim?" dim":"");}
function tools(it,extra){
  const m=marksOf(it);
  return '<span class="art-tools">'+
    '<button onclick="nb.toggleRead(\''+it.id+'\')" title="toggle read">'+(m.read?"unread":"mark read")+'</button>·'+
    '<button onclick="nb.toggleSave(\''+it.id+'\')" title="save for later">'+(m.saved?"un-clip":"✂ clip")+'</button>·'+
    '<button onclick="nb.toggleDim(\''+it.id+'\')" title="not interested">'+(m.dim?"restore":"pass")+'</button>·'+
    '<button onclick="nb.remove(\''+it.id+'\')" title="not news, remove from the paper">⊘ not news</button>'+
    (extra||"")+'</span>';
}
function headlineSpan(it,cls){ return '<span class="headline '+(cls||"")+'" role="button" tabindex="0" onclick="nb.open(\''+it.id+'\')" onkeydown="if(event.key===\'Enter\')nb.open(\''+it.id+'\')">'+esc(it.subject)+"</span>"; }
function dupNote(it){ return it.dupCount>1?' <span class="dup-note">(wired '+it.dupCount+' times)</span>':""; }
function stamp(it,always){
  const old=always|| (S.mode==="latest" && (Date.now()-it.ts)>DAY);
  return old? '<span class="datestamp">'+fmtShort(it.ts)+' — </span>':"";
}
function artHTML(it,opts){
  const m=marksOf(it);
  return '<article class="art'+stateCls(it)+'">'+CHECK+
    '<div class="standing">'+esc(it.paperName)+(opts&&opts.col?" · REGULAR COLUMN":"")+'</div>'+
    '<h4>'+stamp(it)+headlineSpan(it)+dupNote(it)+'</h4>'+
    '<div class="byline">From the desk of '+esc(it.sender)+' — '+fmtShort(it.ts)+', '+fmtTime(it.ts)+'</div>'+
    (m.dim?"":'<p class="snippet">'+esc(it.snippet)+'…</p>')+
    tools(it)+'</article>';
}
function leadHTML(it){
  return '<div class="lead art'+stateCls(it)+'">'+CHECK+
    '<div class="standing">'+esc(it.paperName)+' ✷ THE DAY\'S PRINCIPAL DISPATCH</div>'+
    '<h2>'+headlineSpan(it)+'</h2>'+
    '<p class="deck">'+esc(it.snippet)+'…</p>'+
    '<div class="byline">'+esc(it.sender)+' — '+fmtShort(it.ts)+', '+fmtTime(it.ts)+dupNote(it)+'</div>'+
    tools(it)+'</div>';
}
function classifiedHTML(it){
  return '<div class="cl'+stateCls(it)+'"><b>'+stamp(it)+headlineSpan(it)+'</b> — '+esc(it.snippet.slice(0,160))+'… <i>('+esc(it.paperName)+')</i>'+dupNote(it)+tools(it)+'</div>';
}
function adHTML(it){
  return '<div class="ad'+stateCls(it)+'">'+
    '<div class="ad-kicker">Advertisement</div>'+
    '<h5>'+headlineSpan(it)+'</h5>'+
    '<p>'+esc(it.snippet.slice(0,140))+'…</p>'+
    '<div class="ad-from">'+stamp(it,S.mode==="latest"&&(Date.now()-it.ts)>DAY)+'Placed by '+esc(it.paperName)+dupNote(it)+'</div>'+
    tools(it)+'</div>';
}
function section(title,sub,inner){
  return '<section class="section"><h3 class="sec-head">'+title+(sub?'<small>'+sub+'</small>':"")+'</h3>'+inner+'</section>';
}
function renderPaper(){
  const now=new Date();
  const issueDate=S.mode==="latest"? now : (()=>{const[y,m,d]=S.archiveDate.split("-").map(Number);return new Date(y,m-1,d);})();
  const volNo="VOL. "+["I","II","III","IV","V"][Math.max(0,Math.min(4,issueDate.getFullYear()-2026))]+". ✷ No. "+Math.ceil((issueDate-new Date(issueDate.getFullYear(),0,0))/DAY)+".";
  const wire=S.items.filter(i=>i.section==="wire");
  const cols=S.items.filter(i=>i.section==="columns");
  const moto=S.items.filter(i=>i.section==="moto");
  const jobs=S.items.filter(i=>i.section==="jobs");
  const ads=S.items.filter(i=>i.section==="ads");
  let lead=null;
  const leadPool=wire.concat(cols).filter(i=>!M.dim[i.id]);
  if(leadPool.length){ lead=leadPool.slice().sort((a,b)=>((b.unread?1:0)-(a.unread?1:0))||(b.snippet.length-a.snippet.length))[0]; }
  const restWire=wire.filter(i=>i!==lead), restCols=cols.filter(i=>i!==lead);
  const proprietor=S.boot?S.boot.email.toUpperCase():"";

  let h="";
  h+='<div class="ears"><div class="ear">THE WEATHER — Inbox partly cluttered; scattered promotions toward evening. Chance of spam: slight.</div>'+
     '<div class="ear" style="text-align:right">PRICE TWO CENTS ✷ '+(S.mode==="latest"?"FINAL EDITION":"MORGUE COPY")+'</div></div>';
  h+='<header class="masthead"><h1>The Inbox Herald</h1><div class="motto">“All the Mail That’s Fit to Print.” — Published Daily for the Sole Proprietor</div></header>';
  h+='<div class="dateline-bar"><span>'+volNo+'</span><span class="mid">'+fmtFull(issueDate)+(S.mode==="latest"?" — HOME EDITION":" — BACK NUMBER, FROM THE MORGUE")+'</span><span>'+esc(proprietor)+'</span></div>';
  h+=renderFolio();

  if(S.error){ h+='<div class="notice halt"><h3>'+S.error.title+'</h3><p>'+S.error.body+'</p><p><button onclick="nb.refresh()" style="font-family:inherit;cursor:pointer;background:none;border:1px solid var(--rule);padding:.3rem .8rem;text-transform:uppercase;font-size:.7rem">Try the wires again</button></p></div>'; }
  else if(S.loading){ h+='<div class="press-wait"><span class="gear">✳</span> SETTING TYPE — the compositors are assembling your edition… (a full week of mail can take a minute)</div>'; }
  else if(!S.items.length&&!S.weekItems.length){ h+='<div class="notice"><h3>Nothing on the Wires</h3><p>No newsletters, digests, or notices of sale reached the newsroom in this period. The editor suggests a walk outdoors.</p></div>'; }
  else{
    if(lead) h+=leadHTML(lead);
    if(restWire.length) h+=section("Telegraph Dispatches","LATEST INTELLIGENCE FROM THE TRADE",'<div class="colwrap">'+restWire.map(i=>artHTML(i)).join("")+'</div>');
    if(restCols.length) h+=section("Columns &amp; Correspondence","OUR REGULAR CONTRIBUTORS, IN THEIR OWN WORDS",'<div class="colwrap">'+restCols.map(i=>artHTML(i,{col:true})).join("")+'</div>');
    if(moto.length) h+=section("The Motor-Cycle Page","RACING INTELLIGENCE ✷ BY SPECIAL WIRE",'<div class="colwrap-2">'+moto.map(i=>artHTML(i)).join("")+'</div>');
    if(jobs.length) h+=section("Situations Vacant","EMPLOYMENT CLASSIFIEDS — HONEST WORK FOR HONEST WAGES",'<div class="classified-wrap"><div class="classifieds">'+jobs.map(classifiedHTML).join("")+'</div></div>');
    if(ads.length) h+=section("Advertisements","NOTICES OF SALE, BARGAINS &amp; LIMITED-TIME PROPOSITIONS<br>THE HERALD PRINTS THEM; IT DOES NOT VOUCH FOR THEM",'<div class="ads-grid">'+ads.map(adHTML).join("")+'</div>');
    if(S.weekItems.length){
      const byDay={};
      for(const it of S.weekItems){ const k=fmtShort(it.ts); (byDay[k]=byDay[k]||[]).push(it); }
      let inner='<div class="week colwrap-2">';
      for(const day of Object.keys(byDay)){
        inner+='<div class="art"><h4 style="font-size:.85rem;letter-spacing:.15em">'+day.toUpperCase()+'</h4><ul>'+
          byDay[day].map(it=>'<li class="'+stateCls(it).trim()+'">'+headlineSpan(it)+' <i>('+esc(it.paperName)+')</i>'+dupNote(it)+' '+tools(it)+'</li>').join("")+'</ul></div>';
      }
      inner+='</div>';
      h+=section("The Week Past","EARLIER DISPATCHES, PLAINLY DATED — DAYS TWO THROUGH SEVEN",inner);
    }
  }

  if(S.removedThisIssue.length||Object.keys(M.blockedSenders).length){
    h+='<div class="retractions"><h6>Retractions &amp; Corrections — matter struck by the editor</h6>';
    for(const it of S.removedThisIssue.slice(0,20)){
      h+='<div>“'+esc(it.subject)+'” <i>('+esc(it.sender)+')</i> — <button onclick="nb.restore(\''+it.id+'\')">reinstate</button> · <button onclick="nb.blockSender(\''+esc(it.sender)+'\')">bar this correspondent henceforth</button></div>';
    }
    for(const s of Object.keys(M.blockedSenders)){
      h+='<div>Correspondent barred: <i>'+esc(s)+'</i> — <button onclick="nb.unblockSender(\''+esc(s)+'\')">readmit</button></div>';
    }
    h+='</div>';
  }
  h+='<div class="fleuron">❦ ❦ ❦</div>';
  h+='<div class="footer-line">The Inbox Herald — standalone edition, set by Google Apps Script from the Gmail wire · marks kept in this Google account · Est. 2026</div>';
  return '<div class="sheet">'+h+'</div>';
}
function renderFolio(){
  const today=dateInputVal(new Date());
  const val=S.mode==="archive"?S.archiveDate:today;
  return '<nav class="folio">'+
    '<button onclick="nb.stepDay(-1)">◀ Previous Edition</button>'+
    '<label style="display:inline-flex;gap:.3rem;align-items:center">Back numbers: <input type="date" max="'+today+'" value="'+val+'" onchange="nb.pickDate(this.value)"></label>'+
    '<button class="'+(S.mode==="latest"?"active":"")+'" onclick="nb.latest()">Latest Edition</button>'+
    '<span class="sep">✷</span>'+
    '<button class="'+(S.view==="scrapbook"?"active":"")+'" onclick="nb.setView(\''+(S.view==="scrapbook"?"paper":"scrapbook")+'\')">'+(S.view==="scrapbook"?"Return to the Paper":"The Scrapbook")+'</button>'+
    '<span class="sep">✷</span>'+
    '<button onclick="nb.refresh()" title="fetch fresh mail">☎ Ring the Newsroom</button>'+
    '</nav>';
}
function renderScrapbook(){
  const clips=S.clips.filter(c=>{
    if(c.id in M.savedOv) return !!M.savedOv[c.id];
    return true;
  }).sort((a,b)=>(b.ts||0)-(a.ts||0));
  let h='<div class="sheet scrapbook"><div style="margin-bottom:.6rem">'+renderFolio()+'</div>';
  h+='<h2 class="sb-title">The Scrapbook</h2><div class="sb-sub">Clippings saved for later reading — paste is still wet.</div>';
  if(!clips.length) h+='<div class="sb-empty">No clippings yet. Find an article worth keeping and press ✂ clip — it will be cut from the paper and pasted here.</div>';
  else{
    h+='<div class="sb-grid">';
    for(const c of clips){
      const rot=((hashCode(c.id)%9)-4)/3.5;
      h+='<div class="sb-clip" style="transform:rotate('+rot+'deg)">'+
        '<h4><span class="headline" role="button" tabindex="0" onclick="nb.open(\''+c.id+'\')" onkeydown="if(event.key===\'Enter\')nb.open(\''+c.id+'\')">'+esc(c.subject)+'</span></h4>'+
        '<div class="byline">'+esc(c.paperName)+' — '+esc(c.sender)+'</div>'+
        '<p class="snippet">'+esc(c.snippet)+'…</p>'+
        '<div class="clipped-note">clipped from the '+esc(c.clippedFrom||fmtFull(new Date(c.ts)))+' edition</div>'+
        '<span class="art-tools"><button onclick="nb.toggleSave(\''+c.id+'\')">remove from scrapbook</button></span>'+
        '</div>';
    }
    h+='</div>';
  }
  h+='</div>';
  return h;
}
function renderReader(){
  if(!S.reader) return "";
  const it=S.reader.item;
  let body;
  if(S.reader.err) body='<div class="notice halt"><h3>'+S.reader.err.title+'</h3><p>'+S.reader.err.body+'</p></div>';
  else if(S.reader.body===null) body='<div class="press-wait"><span class="gear">✳</span> Fetching the full column from the wire…</div>';
  else body='<div class="body">'+(S.reader.body||"<p><i>The correspondent supplied no legible text. Consult the original telegram.</i></p>")+'</div>';
  const m=marksOf(it);
  return '<div class="overlay" onclick="if(event.target===this)nb.closeReader()"><div class="clip" role="dialog" aria-modal="true">'+
    '<button class="close" onclick="nb.closeReader()" aria-label="close">✕</button>'+
    '<div class="standing">'+esc(it.paperName||"")+'</div>'+
    '<h2>'+esc(it.subject)+'</h2>'+
    '<div class="clip-meta">'+esc(it.sender)+' ✷ '+fmtFull(new Date(it.ts))+', '+fmtTime(it.ts)+'</div>'+
    body+
    '<div class="clip-foot">'+
      '<button onclick="nb.toggleSave(\''+it.id+'\')">'+(m.saved?"remove clipping":"✂ clip for the scrapbook")+'</button>'+
      '<button onclick="nb.toggleDim(\''+it.id+'\')">'+(m.dim?"restore interest":"not interested")+'</button>'+
      '<button onclick="nb.remove(\''+it.id+'\');nb.closeReader()">⊘ not news — strike it</button>'+
      '<div style="margin-top:.4rem"><a href="https://mail.google.com/mail/u/0/#all/'+esc(it.id)+'" target="_blank" rel="noopener">consult the original telegram in Gmail</a></div>'+
    '</div></div></div>';
}
function render(){
  document.getElementById("app").innerHTML=(S.view==="scrapbook"?renderScrapbook():renderPaper())+renderReader();
}

render();
loadIssue(false);
})();
</script>
